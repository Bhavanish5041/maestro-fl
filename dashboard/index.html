<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAESTRO-FL Dashboard</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --surface: #fafaf5;
            --surface-dim: #dadad5;
            --surface-bright: #fafaf5;
            --surface-container-lowest: #ffffff;
            --surface-container-low: #f4f4ef;
            --surface-container: #eeeee9;
            --surface-container-high: #e8e8e3;
            --surface-container-highest: #e3e3de;
            --on-surface: #1a1c19;
            --on-surface-variant: #504442;
            --inverse-surface: #2f312e;
            --inverse-on-surface: #f1f1ec;
            --outline: #827472;
            --outline-variant: #d3c3c0;
            --surface-tint: #745853;
            --primary: #271310;
            --on-primary: #ffffff;
            --primary-container: #3e2723;
            --on-primary-container: #ae8d87;
            --inverse-primary: #e3beb8;
            --secondary: #8f4c2e;
            --on-secondary: #ffffff;
            --secondary-container: #fda681;
            --on-secondary-container: #773a1d;
            --tertiary: #27130b;
            --on-tertiary: #ffffff;
            --tertiary-container: #3e271e;
            --on-tertiary-container: #ae8d81;
            --error: #ba1a1a;
            --on-error: #ffffff;
            --error-container: #ffdad6;
            --on-error-container: #93000a;
            --primary-fixed: #ffdad4;
            --primary-fixed-dim: #e3beb8;
            --on-primary-fixed: #2b1613;
            --on-primary-fixed-variant: #5b403c;
            --secondary-fixed: #ffdbcd;
            --secondary-fixed-dim: #ffb596;
            --on-secondary-fixed: #360f00;
            --on-secondary-fixed-variant: #723619;
            --tertiary-fixed: #ffdbce;
            --tertiary-fixed-dim: #e4beb2;
            --on-tertiary-fixed: #2b160f;
            --on-tertiary-fixed-variant: #5b4137;
            --background: #fafaf5;
            --on-background: #1a1c19;
            --surface-variant: #e3e3de;

            --aura-shadow: 0 15px 35px rgba(164, 93, 61, 0.15);
            --bronze-glow: inset 0 0 10px rgba(164, 93, 61, 0.6);
            --glass-bg: rgba(250, 250, 245, 0.85);
            --glass-border: inset 1px 1px 0px rgba(255, 255, 255, 0.9), inset -1px -1px 0px rgba(0,0,0,0.05);
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--background);
            background-image: url('data:image/svg+xml;utf8,<svg width="100" height="100" xmlns="http://www.w3.org/2000/svg"><filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="4" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23noise)" opacity="0.04"/></svg>');
            color: var(--on-background);
            font-family: 'Epilogue', sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            transition: box-shadow 0.3s ease;
        }

        .priority-active {
            box-shadow: inset 0 0 50px rgba(186, 26, 26, 0.15);
            border: 2px solid var(--error);
        }

        header {
            padding: 15px 25px;
            background-color: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--outline-variant);
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--glass-border), var(--aura-shadow);
            z-index: 10;
        }

        header h1 {
            margin: 0;
            font-size: 32px;
            font-weight: 600;
            letter-spacing: -0.01em;
            color: var(--primary);
        }

        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        #map {
            flex: 2;
            height: 100%;
            border-right: 1px solid var(--outline-variant);
            background-color: var(--surface-container-low);
            z-index: 1;
        }

        .side-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: transparent;
            overflow-y: auto;
            padding: 15px;
            gap: 15px;
        }

        .panel {
            background-color: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 20px;
            border-radius: 16px;
            box-shadow: var(--glass-border), var(--aura-shadow);
            position: relative;
        }

        .panel h2 {
            margin-top: 0;
            font-size: 20px;
            font-weight: 600;
            color: var(--primary-container);
            margin-bottom: 15px;
        }

        .divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, #A45D3D, transparent);
            margin-bottom: 15px;
            opacity: 0.5;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        button, select {
            font-family: 'Epilogue', sans-serif;
            font-weight: 600;
            font-size: 14px;
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        select {
            background-color: var(--surface-container-low);
            color: var(--on-surface);
            border: 1px solid transparent;
            box-shadow: inset 2px 2px 5px rgba(0,0,0,0.05), inset -1px -1px 2px rgba(255,255,255,0.8);
            outline: none;
        }

        button {
            background-color: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(10px);
            color: var(--on-surface);
            border: 1px solid var(--outline);
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        button:hover { 
            background-color: rgba(255, 255, 255, 0.6);
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(1px);
            box-shadow: inset 2px 2px 5px rgba(0,0,0,0.05);
        }

        .btn-primary, .btn-start, .btn-inject { 
            background-color: var(--primary-container);
            color: var(--on-primary-container);
            border: none;
            box-shadow: var(--bronze-glow), 0 4px 15px rgba(62, 39, 35, 0.3);
        }

        .btn-primary:hover, .btn-start:hover, .btn-inject:hover {
            background-color: #4a2f2a;
        }

        .metric-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 16px;
            color: var(--on-surface-variant);
        }

        .ambulance-status {
            font-size: 20px;
            font-weight: 600;
            text-align: center;
            padding: 15px;
            border-radius: 12px;
            background: var(--surface-container-low);
            box-shadow: inset 2px 2px 6px rgba(0,0,0,0.05), inset -1px -1px 3px rgba(255,255,255,0.8);
            color: var(--on-surface);
        }
        
        .amb-active { color: var(--error); font-weight: 700; animation: pulse 1.5s infinite; }
        
        @keyframes pulse {
            0% { opacity: 1; text-shadow: 0 0 10px var(--error-container); }
            50% { opacity: 0.6; text-shadow: none; }
            100% { opacity: 1; text-shadow: 0 0 10px var(--error-container); }
        }

        canvas { max-width: 100%; margin-top: 10px; }

        .junction-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
            background: var(--surface-container-low);
            border-radius: 20px;
            margin-bottom: 8px;
            box-shadow: inset 1px 1px 3px rgba(0,0,0,0.04), inset -1px -1px 2px rgba(255,255,255,0.9);
            font-size: 14px;
            font-weight: 500;
        }
        
        .status-dot {
            height: 12px;
            width: 12px;
            border-radius: 50%;
            display: inline-block;
            box-shadow: inset 0 0 4px rgba(0,0,0,0.2);
        }
        
        .queue-bar-container {
            width: 60px;
            height: 6px;
            background: var(--surface-variant);
            border-radius: 3px;
            overflow: hidden;
            box-shadow: inset 1px 1px 2px rgba(0,0,0,0.1);
        }
        
        .queue-bar {
            height: 100%;
            background: var(--secondary);
            width: 0%;
            border-radius: 3px;
            transition: width 0.3s ease;
        }

        /* --- Clearing Wave Animations --- */
        @keyframes sync-pulse {
            0%   { transform: scale(1);   opacity: 1; }
            40%  { transform: scale(1.4); opacity: 0.7; }
            100% { transform: scale(1);   opacity: 1; }
        }

        .sync-pulsing {
            animation: sync-pulse 600ms ease-out;
        }

        /* Toast container */
        #toast-container {
            position: fixed;
            top: 70px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: center;
            pointer-events: none;
        }

        .toast {
            background: var(--primary-container);
            color: var(--on-primary-container);
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            font-family: 'Epilogue', sans-serif;
            box-shadow: 0 8px 25px rgba(62, 39, 35, 0.3);
            opacity: 0;
            transform: translateY(-10px);
            animation: toast-in 300ms ease-out forwards, toast-out 300ms ease-in 1700ms forwards;
        }

        @keyframes toast-in {
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes toast-out {
            to { opacity: 0; transform: translateY(-10px); }
        }

        /* Event log panel */
        .event-log-list {
            max-height: 120px;
            overflow-y: auto;
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 0.01em;
            color: var(--on-surface-variant);
        }

        .event-log-item {
            padding: 5px 10px;
            background: var(--surface-container-low);
            border-radius: 6px;
            margin-bottom: 4px;
            border-left: 3px solid var(--secondary);
        }

        .event-log-item.sync-event {
            border-left-color: #2e7d32;
        }
    </style>
</head>
<body>

    <header>
        <h1>MAESTRO-FL Live Dashboard</h1>
        <div id="connection-status">Connecting...</div>
    </header>

    <div class="main-container">
        <!-- Map Panel -->
        <div id="map"></div>

        <!-- Side Panel -->
        <div class="side-panel">
            
            <div class="panel controls">
                <select id="condition-select">
                    <option value="fixed_timer">Fixed Timer</option>
                    <option value="ppo_only">PPO Only</option>
                    <option value="ppo_fedprox">PPO + FedProx</option>
                    <option value="maestro_fl" selected>MAESTRO-FL (Priority)</option>
                </select>
                <button class="btn-start" onclick="sendCommand('start')">▶ Start</button>
                <button onclick="sendCommand('pause')">⏸ Pause</button>
                <button onclick="sendCommand('resume')">▶ Resume</button>
                <button onclick="sendCommand('reset')">🔄 Reset</button>
                <button class="btn-inject" onclick="sendCommand('inject')">🚑 Inject Ambulance</button>
            </div>

            <div class="panel">
                <h2>Ambulance Status</h2>
                <div class="divider"></div>
                <div id="amb-panel" class="ambulance-status">
                    INACTIVE
                </div>
            </div>

            <div class="panel">
                <h2>FL Status</h2>
                <div class="divider"></div>
                <div class="metric-row"><span>Round:</span> <span id="fl-round" style="font-weight:600; color:var(--primary)">0</span></div>
                <div class="metric-row"><span>Active Clients:</span> <span id="fl-clients" style="font-weight:600; color:var(--primary)">3</span></div>
                <div class="metric-row"><span>Steps since agg:</span> <span id="fl-steps" style="font-weight:600; color:var(--primary)">0</span></div>
            </div>

            <div class="panel">
                <h2>Junctions</h2>
                <div class="divider"></div>
                <div id="junction-list"></div>
            </div>

            <div class="panel">
                <h2>Live Metrics</h2>
                <div class="divider"></div>
                <canvas id="waitChart" height="100"></canvas>
                <canvas id="queueChart" height="100"></canvas>
            </div>

            <div class="panel">
                <h2>Event Log</h2>
                <div class="divider"></div>
                <div id="event-log" class="event-log-list"></div>
            </div>

        </div>
    </div>

    <!-- Toast container -->
    <div id="toast-container"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script>
        // --- 1. Map Initialization ---
        // Center on Bangalore roughly (will auto-adjust if junctions load)
        const map = L.map('map').setView([12.9165, 77.5831], 15);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap contributors &copy; CARTO'
        }).addTo(map);

        const ambIcon = L.divIcon({
            html: '<div style="background:red;width:20px;height:20px;border-radius:50%;border:2px solid white;display:flex;justify-content:center;align-items:center;color:white;font-weight:bold;">+</div>',
            className: '',
            iconSize: [24, 24]
        });
        
        let ambulanceMarker = null;
        let junctionMarkers = {};
        let routePolyline = null;
        let hospitalMarker = null;
        const eventLog = [];
        const MAX_LOG_EVENTS = 5;

        // Hospital icon
        const hospitalIcon = L.divIcon({
            html: '<div style="background:white;width:22px;height:22px;border-radius:4px;border:2px solid #3e2723;display:flex;justify-content:center;align-items:center;font-size:14px;">🏥</div>',
            className: '',
            iconSize: [26, 26],
            iconAnchor: [13, 13]
        });

        // --- Helper: queue-based junction color ---
        function junctionColor(queueLen, priorityOverride) {
            if (priorityOverride) return '#2e7d32'; // green = synced/cleared
            if (queueLen > 4) return '#ba1a1a';     // red
            if (queueLen > 2) return '#8f4c2e';     // amber/secondary
            return '#2e7d32';                        // green
        }

        // --- Helper: show toast ---
        function showToast(msg) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = msg;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 2100);
        }

        // --- Helper: add to event log ---
        function addEventLog(text, cssClass) {
            eventLog.unshift({ text, cssClass, time: new Date().toLocaleTimeString() });
            if (eventLog.length > MAX_LOG_EVENTS) eventLog.pop();
            const logDiv = document.getElementById('event-log');
            logDiv.innerHTML = eventLog.map(e =>
                `<div class="event-log-item ${e.cssClass || ''}">[${e.time}] ${e.text}</div>`
            ).join('');
        }

        // --- Helper: pulse a junction marker ---
        function pulseJunction(junctionId) {
            const marker = junctionMarkers[junctionId];
            if (!marker) return;
            const el = marker.getElement();
            if (!el) return;
            // Flash green
            marker.setStyle({ color: '#2e7d32', fillColor: '#2e7d32' });
            marker.setRadius(14);
            el.classList.add('sync-pulsing');
            setTimeout(() => {
                el.classList.remove('sync-pulsing');
                marker.setRadius(8);
            }, 650);
        }

        // --- 2. Chart Initialization ---
        const waitCtx = document.getElementById('waitChart').getContext('2d');
        const queueCtx = document.getElementById('queueChart').getContext('2d');

        const chartConfig = (label, color) => ({
            type: 'line',
            data: { labels: [], datasets: [{ label, data: [], borderColor: color, tension: 0.1, pointRadius: 0 }] },
            options: { responsive: true, animation: false, scales: { x: { display: false }, y: { beginAtZero: true } } }
        });

        const waitChart = new Chart(waitCtx, chartConfig('Avg Waiting Time (s)', '#8f4c2e'));
        const queueChart = new Chart(queueCtx, chartConfig('Avg Queue Length', '#3e2723'));

        const maxChartPoints = 200;

        // --- 3. WebSocket Connection ---
        const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const ws = new WebSocket(wsProtocol + '//' + window.location.host + '/ws');

        ws.onopen = () => {
            document.getElementById('connection-status').innerText = 'Connected';
            document.getElementById('connection-status').style.color = 'var(--success)';
        };

        ws.onclose = () => {
            document.getElementById('connection-status').innerText = 'Disconnected';
            document.getElementById('connection-status').style.color = 'var(--danger)';
        };

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            
            if(data.error) {
                alert("Backend Error: " + data.error);
                return;
            }

            // --- Handle special events ---
            if (data.event === 'ambulance_detected') {
                // Draw route polyline
                if (routePolyline) { map.removeLayer(routePolyline); }
                if (data.route_coords && data.route_coords.length > 1) {
                    routePolyline = L.polyline(data.route_coords, {
                        color: '#827472',
                        weight: 4,
                        dashArray: '8, 8',
                        opacity: 0.7
                    }).addTo(map);
                    map.fitBounds(routePolyline.getBounds(), { padding: [40, 40] });
                }
                // Hospital marker at destination
                if (hospitalMarker) { map.removeLayer(hospitalMarker); }
                hospitalMarker = L.marker([data.dest_lat, data.dest_lon], { icon: hospitalIcon }).addTo(map);
                hospitalMarker.bindPopup('Destination Hospital');

                addEventLog(`Ambulance detected: ${data.route_edges.length} edges`, '');
                showToast('🚑 Ambulance detected, route plotted');
                return;
            }

            if (data.event === 'priority_sync') {
                const shortId = data.junction_id.substring(0, 18) + '...';
                pulseJunction(data.junction_id);
                showToast(`Junction ${shortId} synced, path cleared`);
                addEventLog(`Junction ${shortId} synced (queue: ${data.queue_before})`, 'sync-event');
                return;
            }

            // Update Map
            if (data.ambulance && data.ambulance.active) {
                if (!ambulanceMarker) {
                    ambulanceMarker = L.marker([data.ambulance.lat, data.ambulance.lon], {icon: ambIcon}).addTo(map);
                } else {
                    ambulanceMarker.setLatLng([data.ambulance.lat, data.ambulance.lon]);
                }
                ambulanceMarker.bindPopup(`Speed: ${data.ambulance.speed.toFixed(1)} m/s<br>Travel: ${data.ambulance.travel_time}s`);
            } else if (ambulanceMarker) {
                map.removeLayer(ambulanceMarker);
                ambulanceMarker = null;
            }

            if (data.junctions) {
                const listDiv = document.getElementById('junction-list');
                listDiv.innerHTML = ''; // rebuild list
                
                let firstJunction = true;

                data.junctions.forEach(j => {
                    // Map Marker — color by queue length
                    let color = junctionColor(j.queue_length, j.priority_override);
                    
                    if (!junctionMarkers[j.id]) {
                        junctionMarkers[j.id] = L.circleMarker([j.lat, j.lon], {
                            radius: 8, color: color, fillColor: color, fillOpacity: 0.8, weight: 2
                        }).addTo(map);
                        if(firstJunction) {
                            map.setView([j.lat, j.lon], 15);
                            firstJunction = false;
                        }
                    } else {
                        junctionMarkers[j.id].setStyle({color: color, fillColor: color});
                    }

                    // List Item
                    const shortId = j.id.substring(0, 15) + '...';
                    const qPercent = Math.min((j.queue_length / 30) * 100, 100);
                    
                    listDiv.innerHTML += `
                        <div class="junction-item">
                            <span class="status-dot" style="background:${color}"></span>
                            <span style="font-size:0.8rem">${shortId}</span>
                            <span style="font-size:0.8rem">W: ${j.waiting_time.toFixed(0)}s</span>
                            <div class="queue-bar-container"><div class="queue-bar" style="width:${qPercent}%"></div></div>
                        </div>
                    `;
                });
            }

            // Update UI Effects
            if (data.priority_active) {
                document.body.classList.add('priority-active');
            } else {
                document.body.classList.remove('priority-active');
            }

            // Update Ambulance Panel
            const ambPanel = document.getElementById('amb-panel');
            if (data.ambulance && data.ambulance.active) {
                ambPanel.innerHTML = `
                    <div class="amb-active">ACTIVE ${data.priority_active ? '(PRIORITY ON)' : ''}</div>
                    <div style="font-size:14px; margin-top:10px; color:var(--on-surface); font-weight:500;">
                        Travel Time: ${data.ambulance.travel_time}s<br>
                        Wait Time: ${data.ambulance.waiting_time.toFixed(1)}s<br>
                        Speed: ${data.ambulance.speed.toFixed(1)} m/s
                    </div>
                `;
            } else {
                ambPanel.innerHTML = 'INACTIVE';
                ambPanel.className = 'ambulance-status';
            }

            // Update FL Panel
            if (data.fl) {
                document.getElementById('fl-round').innerText = data.fl.round;
                document.getElementById('fl-clients').innerText = data.fl.clients_active;
                document.getElementById('fl-steps').innerText = data.step - data.fl.last_aggregation_step;
            }

            // Update Charts
            if (data.metrics) {
                const step = data.step;
                
                waitChart.data.labels.push(step);
                waitChart.data.datasets[0].data.push(data.metrics.avg_waiting_time);
                if (waitChart.data.labels.length > maxChartPoints) {
                    waitChart.data.labels.shift();
                    waitChart.data.datasets[0].data.shift();
                }
                waitChart.update();

                queueChart.data.labels.push(step);
                queueChart.data.datasets[0].data.push(data.metrics.avg_queue_length);
                if (queueChart.data.labels.length > maxChartPoints) {
                    queueChart.data.labels.shift();
                    queueChart.data.datasets[0].data.shift();
                }
                queueChart.update();
            }
        };

        // --- 4. Controls ---
        function sendCommand(cmd) {
            let url = `/${cmd}`;
            if (cmd === 'start') {
                const cond = document.getElementById('condition-select').value;
                url += `?condition=${cond}`;
            }
            
            fetch(url, { method: 'POST' })
                .then(res => res.json())
                .then(data => console.log('Command sent:', data))
                .catch(err => console.error('Error sending command:', err));
                
            if (cmd === 'reset') {
                // Clear charts on reset
                waitChart.data.labels = []; waitChart.data.datasets[0].data = []; waitChart.update();
                queueChart.data.labels = []; queueChart.data.datasets[0].data = []; queueChart.update();
                
                // Clear map markers
                if(ambulanceMarker) { map.removeLayer(ambulanceMarker); ambulanceMarker = null; }
                if(routePolyline) { map.removeLayer(routePolyline); routePolyline = null; }
                if(hospitalMarker) { map.removeLayer(hospitalMarker); hospitalMarker = null; }
                Object.values(junctionMarkers).forEach(m => map.removeLayer(m));
                junctionMarkers = {};

                // Clear event log
                eventLog.length = 0;
                document.getElementById('event-log').innerHTML = '';
            }
        }
    </script>
</body>
</html>
